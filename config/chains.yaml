    watcher: true
    watch_interval_s: 4
    memo_mode: none
  # Stage 4 (§21): Tier A when NP_BITCOIN_ESPLORA_URLS is set; the watcher only nudges the poller (BTC is untagged)
  - chain: bip122:000000000019d6689c085ae165831e93
    blockchain: btc
    tier: A
    min_deadline_s: 3600
    default_deadline_s: 7200
    finality: "bitcoin: 1 confirmation below USD 1,000, else 2"
    verification_timeout_s: 7200
    watcher: true
    watch_interval_s: 60
