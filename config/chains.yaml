# Chain profiles (lld/rails.md §4 "Chain profiles"), versioned with the code; NP_CHAINS_FILE overrides.
#
# A chain listed here is a chain NearPay routes to and from. Stage 1 verifies Tier A chains
# independently (NEAR, Ethereum, Base, Arbitrum: indexer/watchers/verifier, ADR-0012); Tier B chains
# settle on the provider's word within NP_TIER_B_LIMITS. Confirmation (owner decision 2026-11-10 17:10, ADR-0022 as
# amended): one block of each chain's own consensus — EVM 1 block, Solana `confirmed`, Bitcoin family 1 confirmation,
# NEAR `final` (Doomslug: the block plus one) — each followed by a post-success re-check (rails §8.12). Values:
#   blockchain              1Click `blockchain` code
#   tier                    A | B
#   min_deadline_s          shortest deposit window offered (payments hides slower routes, FR-PAY-05)
#   default_deadline_s      deposit window of a new execution (capped by the session expiry)
#   finality                evidence rule as text (near: final, solana: confirmed commitment, bitcoin: 1 confirmation);
#                           for EVM chains the spec view shows the effective evm_confirmation instead
#   evm_confirmation        EVM evidence rule (ADR-0022 as amended 2026-11-10 17:10): ONE block of the chain's own
#                           `latest` head on every EVM chain ({kind: confirmations, blocks: 1}; receipt status 1,
#                           re-read in the same block right before the evidence applies, then a post-success
#                           `finalized` re-check, rails §8.12). {kind: finalized} or N blocks remain available.
#                           Override per chain with NP_EVM_CONFIRMATIONS_<CHAINID> = finalized | N.
#   verification_timeout_s  provider SUCCESS → evidence deadline, then `held` (rails §8.8). Kept long enough for
#                           an override back to `finalized` (L2 `finalized` follows L1 finality, ~15–20 min).
#   watcher                 destination watcher runs for this chain (EVM ERC-20 logs; Solana signatures; Bitcoin
#                           Esplora signals)
#   watch_interval_s        watcher cadence while something is in flight (1 s L2, 3 s Ethereum, 2 s Solana, 30 s Bitcoin)
#   confirmation_tiers      Bitcoin family: confirmations by settlement USD value (§21.1), last tier unbounded.
#                           Absent = 1 confirmation for every amount (ADR-0022 as amended); set it to require more.
#   memo_mode               none | required (memo chains are not supported as destinations)
chains:
  - chain: near:mainnet
    blockchain: near
    tier: A
    min_deadline_s: 120
    default_deadline_s: 1800
    finality: final
    verification_timeout_s: 600
    watcher: false
    memo_mode: none
  - chain: eip155:1
    blockchain: eth
    tier: A
    min_deadline_s: 600
    default_deadline_s: 1800
    finality: 1 confirmation
    verification_timeout_s: 2700
