# Chain profiles (lld/rails.md §4 "Chain profiles"), versioned with the code; NP_CHAINS_FILE overrides.
#
# A chain listed here is a chain NearPay routes to and from. Stage 1 verifies Tier A chains
# independently (NEAR, Ethereum, Base, Arbitrum: indexer/watchers/verifier, ADR-0012); Tier B chains
# settle on the provider's word within NP_TIER_B_LIMITS. Values:
#   blockchain              1Click `blockchain` code
#   tier                    A | B
#   min_deadline_s          shortest deposit window offered (payments hides slower routes, FR-PAY-05)
#   default_deadline_s      deposit window of a new execution (capped by the session expiry)
#   finality                evidence rule (evm: `finalized` block tag, near: final, bitcoin: confirmations)
#   verification_timeout_s  provider SUCCESS → evidence deadline, then `held` (rails §8.8). L2 `finalized`
#                           follows L1 finality (~15–20 min), so EVM timeouts allow for it.
#   watcher                 destination watcher runs for this chain (EVM ERC-20 logs; Solana signatures; Bitcoin
#                           Esplora signals)
#   watch_interval_s        watcher cadence (2 s L2, 12 s L1, 4 s Solana, 60 s Bitcoin)
#   confirmation_tiers      confirmations by settlement USD value (Bitcoin, §21.1), last tier unbounded
#   memo_mode               none | required (memo chains are not supported as destinations)
chains:
  - chain: near:mainnet
    blockchain: near
    tier: A
    min_deadline_s: 120
    default_deadline_s: 1800
    finality: final
    verification_timeout_s: 600
    watcher: false
    memo_mode: none
  - chain: eip155:1
    blockchain: eth
    tier: A
    min_deadline_s: 600
    default_deadline_s: 1800
    finality: finalized
    verification_timeout_s: 2700
    watcher: true
    watch_interval_s: 12
    memo_mode: none
  - chain: eip155:8453
