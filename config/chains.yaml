  # Stage 4 (§21): Tier A when NP_SOLANA_RPC_URLS is set (else Tier B at boot, alert tier_a_degraded)
  - chain: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
    blockchain: sol
    tier: A
    min_deadline_s: 300
    default_deadline_s: 1800
